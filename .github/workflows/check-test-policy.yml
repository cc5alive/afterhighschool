name: Check test policy quotes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/test-policy/candidates.json', 'scripts/check-test-policy.mjs']
permissions:
  contents: write
concurrency: { group: test-policy-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Readers and a browser for pages a plain fetch can't confirm
        run: |
          npm install --no-save playwright@1.49.1 pdfjs-dist@4.10.38 xlsx@0.18.5
          npx playwright install --with-deps chromium
      - run: node scripts/check-test-policy.mjs
      - run: head -4 data/test-policy/_check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "afterhighschool-bot"
          git config user.email "hello@afterhighschool.me"
          git add data/test-policy data/test-policy.json
          git diff --cached --quiet || (git commit -m "Test policy quote check results" && ok=; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && ok=1 && break; sleep $((i * 5)); done; [ -n "$ok" ])
