name: Check Common Data Set values
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/cds/drafts/*.json', 'scripts/check-cds.mjs', 'scripts/lib/doc-text.mjs', 'scripts/lib/cds-fields.mjs']
permissions:
  contents: write
concurrency: { group: cds-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Readers for PDF and Excel documents
        run: npm install --no-save --no-package-lock pdfjs-dist@4.10.38 xlsx@0.18.5
      - run: node scripts/check-cds.mjs
      - run: '[ -f data/cds/drafts/_cds-check.md ] && head -40 data/cds/drafts/_cds-check.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Commit results
        run: |
          git config user.name "afterhighschool-bot"
          git config user.email "hello@afterhighschool.me"
          git add data/cds/drafts 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "CDS check results [skip ci]" && git pull --rebase -X theirs && git push)
