name: Tell search engines what changed (IndexNow)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: indexnow, cancel-in-progress: true }
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: Wait until this commit is live
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "https://afterhighschool.me/build.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "Live after $i checks" && exit 0
            sleep 20
          done
          echo "This commit didn't go live within 20 minutes (live: $live); a newer push will catch up." && exit 1
      - name: Load the last state
        run: git fetch origin indexnow-state && git show origin/indexnow-state:state.json > state.json || echo "No state yet: first run submits every page."
      - run: node scripts/indexnow.mjs state.json
      - name: Save the state
        run: |
          mkdir -p /tmp/s && cp state.json /tmp/s/
          git config user.name "afterhighschool-bot" && git config user.email "hello@afterhighschool.me"
          git checkout --orphan indexnow-state-tmp && git rm -rfq . && cp /tmp/s/state.json . && git add state.json
          git commit -qm "IndexNow state for $GITHUB_SHA" && git push -f origin HEAD:indexnow-state
