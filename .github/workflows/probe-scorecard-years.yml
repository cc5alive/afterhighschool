name: Probe Scorecard data years (debug)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env: { SCORECARD_API_KEY: '${{ secrets.SCORECARD_API_KEY }}' }
        run: node scripts/probe-scorecard-years.mjs
      - name: Push the probe output to the scorecard-years-debug branch (not main, so nothing deploys)
        run: |
          git config user.name "afterhighschool-bot"
          git config user.email "hello@afterhighschool.me"
          git checkout --orphan scorecard-years-debug
          git rm -rq --cached .
          git add -f probe
          git commit -qm "Scorecard data-year probe"
          git push -f origin scorecard-years-debug
