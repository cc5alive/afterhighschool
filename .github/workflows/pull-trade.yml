name: Pull trade and two-year school data

on:
  workflow_dispatch:
  schedule:
    - cron: '37 14 * * 1'   # Mondays, after the college pull
  push:
    branches: [main]
    paths:
      - 'scripts/pull-trade.mjs'
      - '.github/workflows/pull-trade.yml'

permissions:
  contents: write

concurrency:
  group: pull-trade
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull and normalize
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
        run: node scripts/pull-trade.mjs
      - name: Add report to run summary
        run: '[ -f data/trade/report.md ] && cat data/trade/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Commit data
        run: |
          git config user.name "afterhighschool-bot"
          git config user.email "hello@afterhighschool.me"
          git add data/trade
          git diff --cached --quiet && exit 0
          git commit -qm "Trade and two-year school data pull"
          git pull --rebase -X theirs -q && git push -q
